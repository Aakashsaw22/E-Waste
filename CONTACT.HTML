<section class="contact-form">
<div class="form-container">
<h2>Send Message</h2>

<form>
<div class="input-box">
<input type="text" placeholder="Full Name">
</div>

<div class="input-box">
<input type="email" placeholder="Email Address">
</div>

<div class="input-box">
<input type="tel" placeholder="Phone number">
</div>

<div class="input-box">
<select id="subject"
onchange="document.getElementById('ewaste').style.display =
this.value=='E-Waste Pickup' ? 'block' : 'none'">
<option>Select Subject</option>
<option>E-Waste Pickup</option>
<option>Recycling Query</option>
<option>Complaint</option>
<option>Partnership</option>
<option>General Inquiry</option>
</select>
</div>

<!-- HIDDEN OPTION -->
<div class="input-box">
<div id="ewaste" style="display:none; margin-top:10px;">
<select>
<option>Select Type of E-Waste</option>
<option>Mobile</option>
<option>Laptop</option>
<option>Battery</option>
<option>TV</option>
<option>Charger</option>
<option>Other</option>
</select>
</div></div>



<div class="input-box">
<textarea placeholder="Write your message..."></textarea>
</div>

<button type="submit">Send Message</button>
</form>
</div>
